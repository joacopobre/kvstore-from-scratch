<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kvstore</title>
  </head>
  <body class="bg-soft text-ink font-sans antialiased">
    <div id="nav-root"></div>

    <section id="project" class="mx-auto max-w-6xl px-4 py-10">
      <div class="grid gap-10 lg:grid-cols-[13rem_minmax(0,1fr)]">
        <!-- left column: the table of contents (filled in by TS later) -->
        <aside
          data-toc
          class="hidden lg:block sticky top-24 self-start"
        ></aside>

        <!-- right column: the content -->
        <div class="rounded-3xl bg-white p-8 md:p-12">
          <h1 class="text-4xl font-semibold">kvstore</h1>

          <h2 id="what-is-it" class="mt-12 scroll-mt-24 text-2xl font-semibold">
            What is it
          </h2>

          <h2
            id="how-it-works"
            class="mt-12 scroll-mt-24 text-2xl font-semibold"
          >
            How it works
          </h2>
          <p class="mt-4 text-muted">Placeholder text...</p>

          <h2 id="try-it" class="mt-12 scroll-mt-24 text-2xl font-semibold">
            Try it
          </h2>
          <p class="mt-4 text-muted">Placeholder text...</p>
        </div>
      </div>
    </section>

    <section id="console" class="mx-auto max-w-4xl px-4 py-10">
      <div class="rounded-3xl bg-white p-8 md:p-12">
        <div class="flex justify-between">
          <h1 class="text-3xl font-semibold">Console</h1>
          <div id="console-nav">
            <!-- nav here -->
          </div>
        </div>
        <form class="max-w-sm mt-8" id="console-form">
          <label for="key" class="block text-sm font-medium text-muted"
            >Key:</label
          >
          <input
            id="key"
            placeholder='"name"'
            class="mt-1 w-full rounded-xl border border-line p-3"
          />
          <div
            id="value-wrapper"
            class="grid transition-[grid-template-rows] duration-300 motion-reduce:transition-none grid-rows-[1fr]"
          >
            <div
              id="value-inner"
              class="min-h-0 overflow-hidden transition-opacity duration-300 motion-reduce:transition-none"
            >
              <label
                for="value"
                class="block mt-3 text-sm font-medium text-muted"
                >Value:</label
              >
              <input
                id="value"
                placeholder='"joaquin"'
                class="mt-1 w-full rounded-xl border border-line p-3"
              />
            </div>
          </div>

          <button
            type="submit"
            class="mt-6 bg-accent cursor-pointer text-white font-semibold py-2.5 px-8 rounded-full"
          >
            Run
          </button>
        </form>
        <pre id="out" class="mt-6 rounded-xl bg-soft p-4 text-sm"></pre>
      </div>
    </section>

    <section id="about" class="mx-auto max-w-6xl px-4 py-10"></section>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
